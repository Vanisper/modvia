  fast-check: ^4.11.0
  publint: ^0.3.18
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
  zod: ^4.6.7

overrides:
  vite@*: "catalog:"

peerDependencyRules:
