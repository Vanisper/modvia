name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release Please & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4

      - name: Checkout release tag
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Setup Vite+
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true

      - name: Run full workspace gate
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: vp run --no-cache ready

      - name: Publish packages to npm with provenance
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: vp pm publish -r --access public --provenance --no-git-checks
